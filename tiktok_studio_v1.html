<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TikTok Studio v1.0</title>
<style>
:root{--bg:#0d1017;--pan:#151a24;--pan2:#1c2230;--line:#2a3244;--tx:#e8ebf2;--muted:#8a93a8;
--acc:#ff2d6f;--acc2:#25f4ee;--gold:#ffc857;--ok:#5fd38d;--warn:#ffb454;--err:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
header{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#0a0d13;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:17px}header h1 span{color:var(--acc)}
.hbtns{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap}
.hbtn{background:var(--pan2);color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:13px}
.hbtn:hover{border-color:var(--acc2)}
select.hbtn{padding:5px 8px}
.wrap{display:flex;min-height:calc(100vh - 50px)}
nav{width:250px;flex-shrink:0;background:var(--pan);border-right:1px solid var(--line);padding:10px 8px;overflow-y:auto;max-height:calc(100vh - 50px);position:sticky;top:50px}
.ng{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 5px}
.ni{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;cursor:pointer;color:#cdd3e0}
.ni:hover{background:var(--pan2)}.ni.active{background:#2a1422;color:#fff;box-shadow:inset 3px 0 0 var(--acc)}
.nn{font-size:11px;font-weight:700;min-width:26px;text-align:center;padding:2px 4px;border-radius:5px;background:#232b3c;color:var(--acc2)}
.ni .dot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:#333c50}.ni .dot.on{background:var(--ok)}
main{flex:1;padding:20px 26px;max-width:1150px}
h2.t{margin:0 0 4px;font-size:22px}.sub{color:var(--muted);margin:0 0 14px;line-height:1.5}
.card{background:var(--pan);border:1px solid var(--line);border-radius:11px;padding:16px;margin:0 0 14px}
.card h3{margin:0 0 10px;font-size:15px;color:var(--gold)}
.hint{background:#15202c;border-left:3px solid var(--acc2);padding:10px 13px;border-radius:7px;margin:0 0 14px;line-height:1.55;color:#cfe}
.okbox,.warnbox,.errbox{padding:9px 12px;border-radius:7px;margin:10px 0;line-height:1.5}
.okbox{background:#12281d;border:1px solid #1f5a39}.warnbox{background:#2d2412;border:1px solid #6b5220}.errbox{background:#2d1616;border:1px solid #6b2626}
.row2,.row3,.row4{display:grid;gap:12px}.row2{grid-template-columns:1fr 1fr}.row3{grid-template-columns:repeat(3,1fr)}.row4{grid-template-columns:repeat(4,1fr)}
@media(max-width:900px){.row2,.row3,.row4{grid-template-columns:1fr}nav{display:none}}
.field{margin:0 0 10px}.field label,label.l{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}
input,textarea,select{width:100%;background:#0f131c;color:var(--tx);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font:inherit}
textarea{min-height:80px;resize:vertical;line-height:1.5}
textarea.out{min-height:260px;font-family:Consolas,monospace;font-size:12.5px;background:#0a0d13}
textarea.sm{min-height:120px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--acc2)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.btn,.btn2,.mini{border:0;border-radius:7px;cursor:pointer;font:inherit;font-weight:600}
.btn{background:var(--acc);color:#fff;padding:8px 15px}.btn:hover{filter:brightness(1.1)}
.btn2{background:var(--pan2);color:var(--tx);border:1px solid var(--line);padding:8px 14px}.btn2:hover{border-color:var(--acc2)}
.mini{background:var(--pan2);color:var(--tx);border:1px solid var(--line);padding:4px 9px;font-size:12px;font-weight:500}
.mini.del{color:var(--err)}
.big{font-size:24px;font-weight:700}
.counter{color:var(--muted);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;background:#232b3c}
.p-ok{background:#1b4a31;color:#8ff0b5}.p-w{background:#4d3b16;color:#ffd48a}.p-e{background:#4d1d1d;color:#ffadad}.p-i{background:#173c4a;color:#8fe9ff}
.pbar{height:7px;background:#232b3c;border-radius:4px;overflow:hidden;margin:6px 0}.pbar i{display:block;height:100%;background:var(--acc2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.tab{padding:7px 13px;border-radius:7px;background:var(--pan2);cursor:pointer;border:1px solid var(--line)}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
details{background:var(--pan2);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:8px 0}
summary{cursor:pointer;font-weight:600}
.chk{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.chk input{width:auto;margin-top:3px}
.slide{background:var(--pan2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.slide h4{margin:0 0 8px;display:flex;gap:8px;align-items:center}
.phone{width:180px;aspect-ratio:9/16;border-radius:14px;background:linear-gradient(160deg,#1a1440,#0b0f22 60%,#2a1d08);position:relative;padding:14px 12px;overflow:hidden;border:1px solid #333}
.phone .ch{font-size:8px;letter-spacing:.1em;color:#ccc}.phone .bd{position:absolute;top:12px;right:10px;font-size:8px;background:var(--gold);color:#000;border-radius:10px;padding:1px 6px;font-weight:700}
.phone .pl{display:inline-block;margin-top:40%;font-size:8px;background:var(--acc);border-radius:10px;padding:1px 7px}
.phone .hd{font-size:15px;font-weight:800;line-height:1.2;margin-top:6px}.phone .hd b{color:var(--gold)}
.phone .ft{position:absolute;bottom:12px;left:12px;right:12px;font-size:7px;color:#aaa;letter-spacing:.1em;border-top:1px solid #444;padding-top:5px}
#toast{position:fixed;bottom:20px;right:20px;background:#222b3d;border:1px solid var(--acc2);padding:10px 16px;border-radius:8px;display:none;z-index:9;max-width:380px}
code{background:#232b3c;padding:1px 5px;border-radius:4px}
.score{font-weight:700}.s-hi{color:var(--ok)}.s-md{color:var(--warn)}.s-lo{color:var(--err)}
</style>
</head>
<body>
<header>
 <h1>TikTok <span>Studio v1.0</span></h1>
 <select class="hbtn" id="chSel" onchange="switchChannel(this.value)"></select>
 <div class="hbtns">
  <button class="hbtn" id="smMeter" onclick="go('storage')">Bộ nhớ</button>
  <button class="hbtn" onclick="exportJSON()">Xuất dữ liệu</button>
  <button class="hbtn" onclick="document.getElementById('imp').click()">Nhập</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="importJSON(event)">
  <button class="hbtn" onclick="go('life')" style="background:#3a1428">Bài mới</button>
 </div>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<div id="toast"></div>

<script>
/* =====================================================================
   TIKTOK STUDIO v1.0
   Quy trình: Kênh -> Chiến lược -> Tìm chủ đề -> Nội dung -> Prompt ảnh
   -> Caption -> QC -> Đăng và đo -> Lưu trữ
   ===================================================================== */
const KEY='tiktok_studio_v1';

/* ---------------- HỒ SƠ KÊNH MẪU ---------------- */
const PRESETS={
 goclang:{
  name:'Góc Lặng',handle:'',niche:'Câu nói tâm lý, tình cảm, cuộc sống',
  audience:'Người trẻ Việt 18-30, hay lướt đêm, đang có áp lực công việc, tình cảm, gia đình',
  format:'single',lang:'Tiếng Việt',
  topics:'Tình cảm, chia tay, cô đơn, áp lực cuộc sống, gia đình, bố mẹ, trưởng thành, tự chữa lành',
  goal:'Tối ưu lượt lưu và chia sẻ',
  voice:'Nhẹ, thấm, như lời tâm sự lúc khuya. Không dạy đời, không sáo rỗng, không dùng từ ngữ quá văn vẻ.',
  footer:'GÓC LẶNG',
  style:'Ảnh điện ảnh chân thực, khoảnh khắc đời thường tĩnh lặng, ánh sáng tự nhiên buồn dịu, nhiều khoảng trống cho chữ',
  palette:'Xanh đêm trầm, xám mưa, điểm ánh vàng ấm của đèn đường hoặc đèn bàn',
  character:'Không bắt buộc nhân vật cố định. Nếu có người: chụp nghiêng, từ phía sau hoặc khuất sáng, không nhìn thẳng camera',
  typo:'Chữ tiếng Việt lớn, sans-serif đậm hoặc serif thanh lịch, màu trắng ngà, từ khóa nhấn màu vàng ấm',
  weather:true,trend:true,
  hashtags:'5',
  rules:'Mỗi bài chỉ một slide duy nhất. Nội dung cô đọng trên một ảnh. Không làm carousel nhiều slide.'
 },
 tuduy:{
  name:'Tư Duy Mỗi Ngày',handle:'',niche:'Phát triển bản thân, tư duy, tâm lý học đời sống',
  audience:'Người trẻ Việt 18-32 muốn hiểu bản thân, tò mò về tâm lý và thói quen',
  format:'carousel',lang:'Tiếng Việt',
  topics:'Tâm lý học, thói quen, kỷ luật, tiền bạc, các mối quan hệ, sai lầm tư duy, hiệu ứng tâm lý',
  goal:'Giữ người xem lướt tới slide cuối, tối ưu lưu và theo dõi',
  voice:'Rõ ràng, sắc, đi thẳng vào sự thật khó nghe. Mỗi slide mở một nút thắt tò mò mới.',
  footer:'TƯ DUY MỖI NGÀY',
  style:'Cinematic photorealistic, bối cảnh và vật thể phải kể đúng nội dung từng slide',
  palette:'Tông tối xanh-tím kết hợp ánh vàng ấm',
  character:'Một nhân vật minh họa nhất quán xuyên suốt: nam khoảng 25 tuổi, tóc đen ngắn, áo sơ mi tối màu, gương mặt trầm tư',
  typo:'Chữ tiếng Việt lớn, rõ, ít nhưng đúng chính tả; từ khóa nhấn màu vàng. Có tiêu đề kênh, badge số slide, pill nhãn SỰ THẬT hoặc BÍ MẬT, footer và câu treo ở cuối slide',
  weather:false,trend:true,
  hashtags:'5',
  rules:'Carousel 9:16. Hook thường bắt đầu bằng câu hỏi Tại sao. Công thức chuỗi tò mò. Tránh chữ nhỏ do AI sinh trên sách, giấy, cửa kính.'
 },
 blank:{name:'Kênh mới',handle:'',niche:'',audience:'',format:'carousel',lang:'Tiếng Việt',topics:'',goal:'',
  voice:'',footer:'',style:'',palette:'',character:'',typo:'',weather:false,trend:true,hashtags:'5',rules:''}
};

/* ---------------- DỮ LIỆU ---------------- */
function newPost(){return{topic:'',angle:'',pillar:'',format:'',hookType:'',emotion:'',
 weather:'',trend:'',date:'',slides:[],caption:'',hashtags:'',cta:'',pin:'',
 sound:'',postTime:'',status:'Ý tưởng',qc:{},raw:{}};}
const DEF={
 active:'goclang',
 channels:{goclang:JSON.parse(JSON.stringify(PRESETS.goclang)),tuduy:JSON.parse(JSON.stringify(PRESETS.tuduy))},
 posts:{goclang:newPost(),tuduy:newPost()},
 vault:{goclang:{},tuduy:{}},
 ideas:{goclang:[],tuduy:[]},
 stats:{goclang:[],tuduy:[]},
 archive:{goclang:[],tuduy:[]},
 context:{city:'Hà Nội',weather:'',events:'',trends:''}
};
let D=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)return fix(r);}catch(e){}
 return JSON.parse(JSON.stringify(DEF));}
function fix(d){const o=JSON.parse(JSON.stringify(DEF));Object.assign(o,d);
 Object.keys(o.channels).forEach(k=>{['posts','vault','ideas','stats','archive'].forEach(f=>{
  if(!o[f])o[f]={};if(o[f][k]===undefined)o[f][k]=f==='posts'?newPost():f==='vault'?{}:[];});
  if(!o.posts[k].qc)o.posts[k].qc={};if(!o.posts[k].raw)o.posts[k].raw={};});
 if(!o.channels[o.active])o.active=Object.keys(o.channels)[0];return o;}
let SAVE_WARN=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}
 catch(e){if(Date.now()-SAVE_WARN>15000){SAVE_WARN=Date.now();
  alert('Bộ nhớ trình duyệt đã đầy, thay đổi vừa rồi chưa được lưu.\nCông cụ sẽ tải bản khẩn cấp và mở trang Bộ nhớ.');
  dl('khan_cap_tiktok_'+stamp()+'.json',JSON.stringify(D));cur='storage';render();}}
 meterSoon();}

const C=()=>D.channels[D.active];
const P=()=>D.posts[D.active];
const VA=()=>D.vault[D.active];
function V(k){return String(VA()[k]||'');}
function setV(k,v){VA()[k]=v;save();}
function setC(k,v){C()[k]=v;save();}
function setPo(k,v){P()[k]=v;save();}
function setCtx(k,v){D.context[k]=v;save();}

/* ---------------- TIỆN ÍCH ---------------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600);}
function copyText(s){(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(()=>toast('Đã copy '+s.length+' ký tự'))
 .catch(()=>{const a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Đã copy');});}
function dl(n,c){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:'text/plain;charset=utf-8'}));a.download=n;document.body.appendChild(a);a.click();a.remove();}
function stamp(){const d=new Date();return d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0');}
function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function num(s){const n=parseFloat(String(s||'').replace(/[^\d.]/g,''));return isNaN(n)?0:n;}
function today(){const d=new Date();const w=['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][d.getDay()];
 return w+', '+d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear();}
function isCarousel(){return (P().format||C().format)==='carousel';}
let tab={};
function tabs(k,list){const t=tab[k]||0;return '<div class="tabs">'+list.map((x,i)=>'<div class="tab '+(i===t?'on':'')+'" onclick="tab[\''+k+'\']='+i+';main()">'+x+'</div>').join('')+'</div>';}
function outBox(id,text,name){return '<div class="bar"><button class="btn" onclick="copyText(document.getElementById(\''+id+'\').value)">Copy prompt</button>'+
 '<button class="btn2" onclick="dl(\''+name+'.txt\',document.getElementById(\''+id+'\').value)">Tải TXT</button>'+
 '<span class="counter">'+text.length+' ký tự</span></div><textarea class="out" id="'+id+'" readonly>'+esc(text)+'</textarea>';}
function pasteBox(k,label,rows){return '<div class="field"><label>'+label+'</label><textarea rows="'+(rows||6)+'" oninput="setV(\''+k+'\',this.value)">'+esc(V(k))+'</textarea></div>';}

/* =====================================================================
   THƯ VIỆN KIẾN THỨC
   ===================================================================== */
const HOOKS=[
 {id:'why',name:'Câu hỏi Tại sao',f:'Tại sao [hiện tượng quen thuộc] lại [kết quả bất ngờ]?',ex:'Tại sao người càng tử tế lại càng hay bị bỏ lại?',fit:'carousel'},
 {id:'truth',name:'Sự thật khó nghe',f:'Sự thật là [điều người ta né tránh].',ex:'Sự thật là không ai bận đến mức không thể nhắn cho bạn.',fit:'both'},
 {id:'mirror',name:'Soi gương',f:'Nếu bạn [hành vi cụ thể], có thể bạn đang [trạng thái].',ex:'Nếu bạn hay nói "không sao đâu", có thể bạn đã mệt từ lâu.',fit:'both'},
 {id:'contrast',name:'Đối lập',f:'[Điều ai cũng nghĩ] nhưng [điều thực sự xảy ra].',ex:'Người ta nghĩ im lặng là hết thương. Thật ra là hết sức.',fit:'single'},
 {id:'number',name:'Con số cụ thể',f:'[Số] dấu hiệu / điều / sai lầm [chủ đề].',ex:'3 dấu hiệu bạn đang sống vì kỳ vọng của người khác.',fit:'carousel'},
 {id:'secret',name:'Bí mật bị giấu',f:'Điều [nhóm người] không bao giờ nói với bạn về [chủ đề].',ex:'Điều bố mẹ không bao giờ nói ra khi con cái đi xa.',fit:'carousel'},
 {id:'moment',name:'Khoảnh khắc chung',f:'Có một lúc [khoảnh khắc ai cũng từng trải].',ex:'Có một lúc bạn nhận ra mình không còn chờ tin nhắn của ai nữa.',fit:'single'},
 {id:'weather',name:'Thời tiết gợi cảm xúc',f:'[Thời tiết hôm nay] và [cảm xúc liên quan].',ex:'Hà Nội trở lạnh rồi, còn bạn đã có ai để nhắn "mặc ấm vào" chưa?',fit:'single'},
 {id:'letter',name:'Lời nhắn gửi',f:'Gửi [người/đối tượng], [điều muốn nói].',ex:'Gửi người đang cố tỏ ra ổn: hôm nay không ổn cũng được.',fit:'single'},
 {id:'mistake',name:'Sai lầm phổ biến',f:'Sai lầm lớn nhất khi [tình huống] là [hành động tưởng đúng].',ex:'Sai lầm lớn nhất khi buồn là cố tỏ ra mình không buồn.',fit:'both'}
];
const PILLARS={
 single:['Tình yêu và chia tay','Cô đơn và trưởng thành','Gia đình và bố mẹ','Áp lực công việc, tiền bạc','Tự chữa lành','Thời tiết và cảm xúc','Tình bạn','Lời nhắn gửi bản thân'],
 carousel:['Hiệu ứng tâm lý','Sai lầm tư duy','Thói quen và kỷ luật','Tiền bạc và giá trị','Mối quan hệ và ranh giới','Bí mật của người thành công','Sự thật khó nghe','Tự hiểu bản thân']
};
const EMOTIONS=['Thấu cảm','Nhói lòng','Ấm áp','Tỉnh ngộ','Tò mò','Được an ủi','Hoài niệm','Muốn gửi cho ai đó'];
const CAROUSEL_ARCS={
 5:['HOOK: câu hỏi hoặc sự thật gây sốc, không trả lời','ĐÀO SÂU: vì sao ai cũng mắc phải, mở nút tò mò thứ hai','SỰ THẬT: cơ chế thật sự đằng sau','BÍ MẬT: điều ít người biết, cách thoát ra','KẾT: một câu đọng lại để lưu, kêu gọi lưu hoặc gửi'],
 7:['HOOK: câu hỏi Tại sao','BỐI CẢNH: tình huống quen thuộc','NÚT THẮT: điều nghịch lý','SỰ THẬT 1','SỰ THẬT 2 hoặc BÍ MẬT','CÁCH LÀM: một hành động nhỏ làm được ngay','KẾT: câu đọng lại, kêu gọi lưu hoặc theo dõi'],
 9:['HOOK','BỐI CẢNH','NÚT THẮT','SỰ THẬT 1','SỰ THẬT 2','BÍ MẬT','CÁCH LÀM 1','CÁCH LÀM 2','KẾT và kêu gọi']
};

 'NHIỆM VỤ\n'+
 '1. ĐỊNH VỊ: kênh này khác gì các kênh cùng ngách. Viết một câu định vị dưới 20 từ.\n'+

 '3. CÔNG THỨC HOOK: 6 công thức hook hợp với giọng kênh, mỗi cái kèm 2 ví dụ tiếng Việt.\n'+
 '4. NHỊP ĐĂNG: số bài mỗi ngày, khung giờ nên thử cho khán giả Việt Nam, cách thử nghiệm khung giờ trong 2 tuần.\n'+
 '5. CHỈ SỐ CẦN THEO DÕI: giải thích vì sao với nội dung ảnh thì tỷ lệ lưu và chia sẻ quan trọng, ngưỡng tốt, trung bình, kém mà bạn khuyên dùng để tự đánh giá, nói rõ đây là ngưỡng tham khảo.\n'+
 '6. KẾ HOẠCH 30 NGÀY: chia 4 tuần, mỗi tuần một mục tiêu, việc cần làm, và cách đo.\n'+
 '7. TƯƠNG TÁC: cách viết caption, câu hỏi kéo bình luận, cách trả lời bình luận để tạo bài tiếp theo.\n'+
 '8. RỦI RO: những điều dễ bị hạn chế phân phối hoặc vi phạm nguyên tắc cộng đồng trong ngách này, và cách tránh.\n'+
 '9. MỞ RỘNG: khi nào nên thêm video ngắn, series, livestream, hoặc kênh phụ.\n\n'+
 'ĐỊNH DẠNG TRẢ LỜI\nDùng đúng các tiêu đề viết hoa: DINH VI, TRU COT, HOOK, NHIP DANG, CHI SO, KE HOACH 30 NGAY, TUONG TAC, RUI RO, MO RONG.\n'+
 'Viết ngắn gọn, cụ thể, dùng được ngay. Không hứa hẹn lượt xem.';}
function pStrategy(){
 return '<h2 class="t">01 · Chiến lược kênh</h2><p class="sub">Chạy một lần khi mở kênh, sau đó chạy lại mỗi 2 tuần với số liệu mới.</p>'+
 '<div class="hint">Prompt tự ghép hồ sơ kênh, số liệu các bài đã đăng và danh sách chủ đề cũ. Càng nhập nhiều số liệu ở mục 07, chiến lược càng sát.</div>'+
 '<div class="card"><h3>Prompt chiến lược</h3>'+outBox('stp',strategyPrompt(),'chien_luoc_'+C().name)+'</div>'+
 '<div class="card"><h3>Dán kết quả chiến lược</h3>'+pasteBox('strategy','Kết quả',12)+
 '<div class="bar"><button class="btn2" onclick="pillarsFromStrategy()">Lấy trụ cột từ kết quả</button></div></div>';}
function pillarsFromStrategy(){const t=V('strategy');const m=t.split(/\n/);let on=false,out=[];
 m.forEach(l=>{const n=norm(l).trim();if(/^#*\s*\**tru cot/.test(n)){on=true;return;}
  if(on&&/^#*\s*\**(hook|nhip dang|chi so|ke hoach)/.test(n)){on=false;}
  if(on){const x=l.replace(/^[\s\-\*\d\.\)#]+/,'').split(/[:\-–|(]/)[0].trim();if(x.length>2&&x.length<60)out.push(x);}});
 out=[...new Set(out)].slice(0,8);if(!out.length)return toast('Không đọc được trụ cột');
 setC('pillars',out.join('\n'));toast('Đã lưu '+out.length+' trụ cột');main();}
function pillarList(){const c=C();const own=String(c.pillars||'').split('\n').map(s=>s.trim()).filter(Boolean);
 return own.length?own:PILLARS[c.format==='single'?'single':'carousel'];}

function topicPrompt(n){const c=C();n=n||15;
 return 'Bạn là biên tập viên nội dung TikTok Việt Nam, giỏi bắt trend và hiểu tâm lý người trẻ.\n\n'+
 'Trước khi đề xuất, hãy tra cứu web: thời tiết hiện tại, các ngày lễ và sự kiện sắp tới, và những chủ đề, câu nói, âm thanh đang nổi trên TikTok Việt Nam tuần này.\n\n'+
 channelBlock()+'\n'+ctxBlock()+'\n'+
 'TRỤ CỘT NỘI DUNG\n'+pillarList().map(p=>'- '+p).join('\n')+'\n\n'+statsBlock()+'\n'+doneBlock()+'\n'+
 'NHIỆM VỤ\nĐề xuất '+n+' chủ đề cho '+(c.format==='single'?'bài một slide':'bài carousel')+', ưu tiên chủ đề đăng được ngay trong 48 giờ tới.\n'+
 'Mỗi chủ đề phải chấm 5 tiêu chí thang 1 đến 5:\n'+
 '- THOI DIEM: độ hợp với thời tiết, sự kiện, trend lúc này\n- CAM XUC: sức chạm cảm xúc\n- LUU: khả năng người xem bấm lưu\n- CHIA SE: khả năng gửi cho người khác hoặc đăng lại\n- MOI: độ mới so với các chủ đề đã đăng\n\n'+
 'ĐỊNH DẠNG BẮT BUỘC\nMỗi chủ đề đúng một dòng, các cột ngăn bằng dấu gạch đứng, không đánh số, không thêm dòng giải thích:\n'+
 'Chủ đề | Trụ cột | Góc nhìn | Hook gợi ý | Cảm xúc | Lý do đúng thời điểm | THOI DIEM | CAM XUC | LUU | CHIA SE | MOI\n\n'+
 'Ví dụ:\nNgười hay nói "không sao đâu" | Tự chữa lành | Mệt nhưng không dám nói | Có một lúc bạn nhận ra "không sao đâu" là câu nói dối quen nhất | Nhói lòng | Cuối tháng, áp lực công việc cao | 4 | 5 | 5 | 4 | 4\n\n'+
 'Sau bảng, viết thêm mục TOP 3 giải thích ngắn vì sao nên đăng 3 chủ đề này trước.';}
function parseIdeas(t){const out=[];String(t||'').split(/\n/).forEach(l=>{
 if(l.indexOf('|')<0)return;const p=l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(s=>s.trim());
 if(p.length<6)return;if(/^chủ đề$/i.test(p[0])||/^-+$/.test(p[0].replace(/[:\s]/g,'')))return;
 const sc=p.slice(-5).map(num);const has=sc.every(x=>x>=1&&x<=5);
 out.push({topic:p[0].replace(/^[\d\.\-\*\s]+/,''),pillar:p[1]||'',angle:p[2]||'',hook:p[3]||'',emotion:p[4]||'',why:p[5]||'',
  s:has?{time:sc[0],emo:sc[1],save:sc[2],share:sc[3],fresh:sc[4]}:null,at:new Date().toLocaleDateString('vi-VN')});});return out;}
function ideaScore(i){if(!i.s)return 0;const s=i.s;
 return (s.time*1.2+s.emo*1.0+s.save*1.4+s.share*1.4+s.fresh*1.0)/(5*6)*100;}
function importIdeas(){const t=document.getElementById('ideaIn').value;const a=parseIdeas(t);
 if(!a.length)return toast('Không đọc được dòng nào, cần định dạng có dấu |');
 const ex=D.ideas[D.active].map(x=>norm(x.topic));let n=0;
 a.forEach(x=>{if(ex.indexOf(norm(x.topic))<0){D.ideas[D.active].push(x);n++;}});
 save();toast('Đã thêm '+n+' chủ đề vào ngân hàng');main();}
function addIdeaManual(){const t=prompt('Nhập chủ đề');if(!t)return;D.ideas[D.active].push({topic:t,pillar:'',angle:'',hook:'',emotion:'',why:'',s:null,at:new Date().toLocaleDateString('vi-VN')});save();main();}
function useIdea(i){const x=D.ideas[D.active][i];if(!x)return;const p=P();
 if(p.topic&&p.topic!==x.topic&&!confirm('Bài đang làm là "'+p.topic+'". Thay bằng chủ đề này?\nNội dung slide hiện tại sẽ được giữ, nên dùng nút Bài mới nếu muốn làm sạch.'))return;
 Object.assign(p,{topic:x.topic,pillar:x.pillar,angle:x.angle,hookText:x.hook,emotion:x.emotion,trend:x.why});
 x.used=true;save();toast('Đã chọn: '+x.topic);go('content');}
function delIdea(i){D.ideas[D.active].splice(i,1);save();main();}
function pTopics(){const ideas=D.ideas[D.active].map((x,i)=>Object.assign({},x,{_i:i,_sc:ideaScore(x)})).sort((a,b)=>b._sc-a._sc);
 const x=D.context,c=C();
 let h='<h2 class="t">02 · Tìm chủ đề</h2><p class="sub">Kết hợp thời tiết, sự kiện và trend để ra chủ đề đăng được ngay.</p>'+
 '<div class="card"><h3>Ngữ cảnh hôm nay · '+today()+'</h3><div class="row3">'+
 '<div class="field"><label>Thành phố tham chiếu</label><input value="'+esc(x.city)+'" oninput="setCtx(\'city\',this.value)"></div>'+
 '<div class="field"><label>Thời tiết (để trống, AI tự tra)</label><input value="'+esc(x.weather)+'" placeholder="Ví dụ: mưa phùn, 19 độ, gió mùa về" oninput="setCtx(\'weather\',this.value)"></div>'+
 '<div class="field"><label>Sự kiện sắp tới</label><input value="'+esc(x.events)+'" placeholder="Ví dụ: 20/10, mùa thi, Trung thu" oninput="setCtx(\'events\',this.value)"></div></div>'+
 '<div class="field"><label>Trend, câu nói, âm thanh đang nổi</label><textarea rows="2" oninput="setCtx(\'trends\',this.value)">'+esc(x.trends)+'</textarea></div>'+
 '<div class="counter">Ngữ cảnh dùng chung cho mọi kênh. Kênh '+esc(c.name)+(c.weather?' <b>có</b>':' <b>không</b>')+' ưu tiên thời tiết.</div></div>'+
 '<div class="card"><h3>Prompt tìm chủ đề</h3><div class="bar">'+[10,15,25].map(n=>'<button class="mini" onclick="tab.tn='+n+';main()">'+n+' chủ đề</button>').join('')+'</div>'+
 outBox('tpp',topicPrompt(tab.tn||15),'tim_chu_de')+'</div>'+
 '<div class="card"><h3>Dán bảng kết quả vào ngân hàng chủ đề</h3><div class="field"><textarea id="ideaIn" rows="6" placeholder="Chủ đề | Trụ cột | Góc nhìn | Hook | Cảm xúc | Lý do | 4 | 5 | 5 | 4 | 4"></textarea></div>'+
 '<div class="bar"><button class="btn" onclick="importIdeas()">Đọc và thêm</button><button class="btn2" onclick="addIdeaManual()">Thêm tay một chủ đề</button></div></div>';
 h+='<div class="card"><h3>Ngân hàng chủ đề ('+ideas.length+')</h3>';
 if(!ideas.length)h+='<p class="sub">Chưa có chủ đề. Chạy prompt ở trên rồi dán kết quả về.</p>';
 else h+='<table><tr><th>Điểm</th><th>Chủ đề</th><th>Hook gợi ý</th><th>Trụ cột</th><th></th></tr>'+ideas.map(i=>{
  const cl=i._sc>=80?'s-hi':i._sc>=60?'s-md':'s-lo';
  return '<tr><td class="score '+cl+'">'+(i.s?i._sc.toFixed(0):'-')+'</td><td><b>'+esc(i.topic)+'</b>'+(i.used?' <span class="pill p-i">đã dùng</span>':'')+
  '<br><span class="counter">'+esc(i.angle)+(i.why?' · '+esc(i.why):'')+'</span></td><td class="counter" style="max-width:280px">'+esc(i.hook)+'</td>'+
  '<td class="counter">'+esc(i.pillar)+'</td><td style="white-space:nowrap"><button class="mini" onclick="useIdea('+i._i+')">Làm bài này</button> <button class="mini del" onclick="delIdea('+i._i+')">X</button></td></tr>';}).join('')+'</table>'+
  '<p class="counter">Điểm = thời điểm ×1,2 + cảm xúc + lưu ×1,4 + chia sẻ ×1,4 + độ mới, quy về thang 100. Lưu và chia sẻ được nhân hệ số cao vì là tín hiệu mạnh với nội dung ảnh.</p>';
 return h+'</div>';}

function parseSlides(t){const slides=[],extra={};let cur=null;
 const map={'nhan':'label','chu chinh':'main','chu phu':'sub','boi canh anh':'scene','cau treo':'hang'};
 String(t||'').split(/\n/).forEach(l=>{const raw=l.trim();const n=norm(raw).replace(/[*#]/g,'').trim();
  const m=n.match(/^slide\s*(\d+)\s*:?$/);if(m){cur={n:+m[1],label:'',main:'',sub:'',scene:'',hang:''};slides.push(cur);return;}
  if(raw.indexOf('|')<0)return;const i=raw.indexOf('|');const k=norm(raw.slice(0,i)).replace(/[*#\-]/g,'').trim();const v=raw.slice(i+1).trim().replace(/^\[|\]$/g,'');
  if(['caption','cta','binh luan ghim','hashtag'].indexOf(k)>=0){extra[k]=v;cur=null;return;}
  if(cur&&map[k])cur[map[k]]=v;});
 return{slides:slides.filter(s=>s.main||s.scene),extra};}

 if(r.extra['binh luan ghim'])p.pin=r.extra['binh luan ghim'];if(r.extra['hashtag'])p.hashtags=r.extra['hashtag'];
 save();toast('Đã đọc '+p.slides.length+' slide');main();}

  {k:'a5',t:'Chữ mỗi slide không quá dài',ok:p.slides.every(s=>String(s.main||'').split(/\s+/).length<=(car?32:28))},

  {k:'a7',t:'Có caption',ok:!!p.caption},

function rankStats(){return (D.stats[D.active]||[]).map((x,i)=>{const v=num(x.views)||1;
 const sv=num(x.saves)/v*100,sh=num(x.shares)/v*100,cm=num(x.comments)/v*100,fl=num(x.follows)/v*100;
 return Object.assign({},x,{_i:i,_save:sv,_share:sh,_cm:cm,_fl:fl,_score:Math.min(100,sv*8+sh*10+cm*4+fl*15)});}).sort((a,b)=>b._score-a._score);}
function addStat(){D.stats[D.active].unshift({date:new Date().toISOString().slice(0,10),topic:P().topic||'',hook:(HOOKS.find(h=>h.id===P().hookType)||{}).name||'',pillar:P().pillar||'',views:'',likes:'',saves:'',shares:'',comments:'',follows:''});save();main();}
function setStat(i,k,v){D.stats[D.active][i][k]=v;save();}
function delStat(i){D.stats[D.active].splice(i,1);save();main();}
function groupBy(f){const m={};rankStats().forEach(x=>{const k=x[f]||'(trống)';if(!m[k])m[k]={n:0,sc:0,sv:0};m[k].n++;m[k].sc+=x._score;m[k].sv+=x._save;});
 return Object.keys(m).map(k=>({k,n:m[k].n,sc:m[k].sc/m[k].n,sv:m[k].sv/m[k].n})).sort((a,b)=>b.sc-a.sc);}

 'SỐ LIỆU\nNgày | Chủ đề | Trụ cột | Hook | View | Lưu | Chia sẻ | Bình luận | Theo dõi\n'+(D.stats[D.active]||[]).map(x=>[x.date,x.topic,x.pillar,x.hook,x.views,x.saves,x.shares,x.comments,x.follows].join(' | ')).join('\n');}

 let h='<h2 class="t">07 · Số liệu và học hỏi</h2><p class="sub">Nhập số liệu sau 24 đến 48 giờ. Công cụ tính tỷ lệ lưu, chia sẻ và chấm điểm để biết nên làm tiếp gì.</p>'+
 '<div class="card"><div class="bar"><button class="btn" onclick="addStat()">Thêm dòng cho bài hiện tại</button></div>';
 if(s.length){h+='<div style="overflow-x:auto"><table><tr><th>Ngày</th><th>Chủ đề</th><th>Trụ cột</th><th>Hook</th><th>View</th><th>Lưu</th><th>Chia sẻ</th><th>BL</th><th>Theo dõi</th><th>Điểm</th><th></th></tr>'+
  s.map((x,i)=>{const rr=r.find(y=>y._i===i);const cl=rr._score>=60?'s-hi':rr._score>=30?'s-md':'s-lo';

   '<td class="score '+cl+'">'+rr._score.toFixed(0)+'<br><span class="counter">lưu '+rr._save.toFixed(1)+'%</span></td><td><button class="mini del" onclick="delStat('+i+')">X</button></td></tr>';}).join('')+'</table></div>'+
  '<p class="counter">Điểm = lưu% ×8 + chia sẻ% ×10 + bình luận% ×4 + theo dõi% ×15, tối đa 100. Đây là thang tự chấm để so sánh các bài với nhau, không phải chỉ số của TikTok.</p>';}
 h+='</div>';

 const it=(id,n,l)=>'<div class="ni '+(cur===id?'active':'')+'" onclick="go(\''+id+'\')"><span class="nn">'+n+'</span><span>'+l+'</span>'+d(id)+'</div>';
 document.getElementById('nav').innerHTML=it('home','⌂','Tổng quan')+
 '<div class="ng">Kênh</div>'+it('channel','00','Hồ sơ kênh')+it('strategy','01','Chiến lược kênh')+
 '<div class="ng">Sản xuất bài</div>'+it('topics','02','Tìm chủ đề')+it('content','03','Nội dung')+it('image','04','Prompt tạo ảnh')+it('caption','05','Caption')+it('qc','06','Kiểm tra')+
 '<div class="ng">Sau khi đăng</div>'+it('stats','07','Số liệu')+it('life','↻','Bài mới và lưu trữ')+it('storage','BN','Bộ nhớ');
 document.getElementById('chSel').innerHTML=Object.keys(D.channels).map(k=>'<option value="'+k+'" '+(k===D.active?'selected':'')+'>'+esc(D.channels[k].name)+'</option>').join('');}
function main(){document.getElementById('main').innerHTML=(PAGES[cur]||pHome)();meter();}
function render(){nav();main();}
render();
</script>
